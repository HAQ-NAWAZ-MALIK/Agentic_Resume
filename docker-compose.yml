 version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agentic-resume-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-agentic_resume}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: agentic-resume-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - FLASK_APP=backend/app.py
      - FLASK_ENV=${FLASK_ENV:-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - DATABASE_URI=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-agentic_resume}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-supersecretkey}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - ./ai:/app/ai

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentic-resume-client
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:5000}

volumes:
  postgres_data: